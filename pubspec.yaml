name: kashu
description: "KashU - Your Personal Investment Portfolio Tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Charts
  fl_chart: ^0.66.2
  
  # Security
  local_auth: ^2.1.8
  flutter_secure_storage: ^9.0.0
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  path_provider: ^2.1.2
  share_plus: ^7.2.2
  collection: ^1.18.0

  # Networking (for price tracking)
  http: ^1.2.0

  # Home screen widget (Android AppWidget + iOS WidgetKit bridge)
  home_widget: ^0.6.0
  # Export (CSV + PDF)
  pdf: ^3.11.1
  printing: ^5.13.2
  csv: ^6.0.0
  # Crash reporting
  sentry_flutter: ^8.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

  # Code Generation
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/
    - assets/images/

  # Using system fonts for Phase 1 (faster load times, no font files needed)
  # Custom fonts can be added in Phase 2 for branding
